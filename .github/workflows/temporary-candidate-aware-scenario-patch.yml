name: Temporary Candidate-Aware Scenario Patch

on:
  push:
    branches:
      - release/rc1-final-candidate-pin

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/rc1-final-candidate-pin
          fetch-depth: 0
      - name: Make scenario source inspection candidate-aware
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("scripts/run_scenario_matrix.py")
          text = path.read_text(encoding="utf-8")

          anchor = '''def expect(cond: bool, msg: str) -> None:\n    if not cond:\n        raise AssertionError(msg)\n\n\n'''
          helper = '''def expect(cond: bool, msg: str) -> None:\n    if not cond:\n        raise AssertionError(msg)\n\n\ndef expected_action_pin() -> str:\n    """Return the Action ref appropriate to stable or pre-release candidate mode."""\n\n    candidate = os.environ.get("OVK_CANDIDATE_SHA", "").strip().lower()\n    if candidate:\n        expect(\n            len(candidate) == 40 and all(ch in "0123456789abcdef" for ch in candidate),\n            f"OVK_CANDIDATE_SHA must be exact 40-hex, got {candidate!r}",\n        )\n        return f"fraware/open-verification-kernel@{candidate}"\n    return f"fraware/open-verification-kernel@v{OVK_VERSION}"\n\n\n'''
          if text.count(anchor) != 1:
              raise SystemExit(f"expected one helper anchor, found {text.count(anchor)}")
          text = text.replace(anchor, helper, 1)

          replacements = {
              '''        "fraware/open-verification-kernel@v1.2.1" in texts,\n        "Action pin missing in PR workflows",\n''': '''        expected_action_pin() in texts,\n        f"Action pin {expected_action_pin()} missing in PR workflows",\n''',
              '''            "Action workflows pin @v1.2.1 with post-comment and emit-check; "\n''': '''            f"Action workflows pin {expected_action_pin()} with post-comment and emit-check; "\n''',
              '''    expect("fraware/open-verification-kernel@v1.2.1" in text, "must pin @v1.2.1")\n''': '''    expect(expected_action_pin() in text, f"must pin {expected_action_pin()}")\n''',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one replacement target, found {text.count(old)}: {old!r}")
              text = text.replace(old, new, 1)

          path.write_text(text, encoding="utf-8")
          PY
          python -m py_compile scripts/run_scenario_matrix.py
          rm .github/workflows/temporary-candidate-aware-scenario-patch.yml
          git config user.name "release-maintenance"
          git config user.email "release-maintenance@users.noreply.github.com"
          git add scripts/run_scenario_matrix.py .github/workflows/temporary-candidate-aware-scenario-patch.yml
          git diff --cached --check
          git commit -m "release: make scenario assertions candidate-aware"
          git push origin HEAD:release/rc1-final-candidate-pin
