name: Pin Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  OVK_CANDIDATE_SHA: "b8d734f4a6a92a534aed87db91e12df16b718a9e"

jobs:
  assert-ovk-pin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Assert exact candidate-bound OVK Action pin
        run: python scripts/assert_ovk_pin.py --candidate-sha "$OVK_CANDIDATE_SHA"
