name: OVK Advisory PR Path

# Candidate-bound pre-publication validation for OVK v1.3.0-rc.1.
# The Action is pinned to the exact audited candidate SHA; move to the immutable
# release tag only after attributable publication completes.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write
  checks: write

env:
  OVK_PACKAGE_VERSION: "1.3.0-rc.1"

jobs:
  ovk-advisory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: OVK advisory (comment + check run)
        id: ovk
        uses: fraware/open-verification-kernel@40fefb4de8b59978fa338fc09d3a185d5708bc1f
        with:
          mode: advisory
          use-check: "true"
          emit-check: "true"
          post-comment: "true"
      - name: Upload Action evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ovk-advisory-pr-artifacts
          path: |
            ovk-evidence.json
            ovk-pr-comment.md
            ovk-attestation.json
            ovk-artifact-manifest.json
            ovk-evidence-quality.json
          if-no-files-found: ignore
